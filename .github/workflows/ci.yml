name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (including LFS-tracked model file)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install pytest flake8

      - name: Lint with flake8
        run: flake8 api/ tests/

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cats-dogs-api:latest ./api

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cats-dogs-api:latest

  deploy:
    needs: build-test-push
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest image and restart service
        run: |
          docker-compose pull
          docker-compose up -d

      - name: Install smoke test dependencies
        run: pip install requests pillow

      - name: Run smoke tests
        run: python3 smoke_test.py
